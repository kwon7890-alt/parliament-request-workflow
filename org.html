<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A부 조직도 검색</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --navy: #14243d;
      --blue: #2763c4;
      --pale: #edf4ff;
      --line: #d8e0ea;
      --ink: #1a2637;
      --muted: #637083;
      --paper: rgba(255, 255, 255, .94);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 6%, rgba(80, 139, 225, .16), transparent 28rem),
        linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
    }

    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 64px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; color: var(--navy); font-size: clamp(2rem, 5vw, 3.7rem); letter-spacing: -.055em; }
    .lead { max-width: 680px; margin: 16px 0 0; color: var(--muted); line-height: 1.75; }

    .search-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin: 32px 0 18px;
      padding: 18px;
      border: 1px solid rgba(39, 99, 196, .16);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 18px 50px -34px rgba(20, 36, 61, .45);
    }

    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 16px; top: 50%; width: 20px; transform: translateY(-50%); color: #7c899a; }

    #search {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 48px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, transform .35s cubic-bezier(.34, 1.56, .64, 1);
    }

    #search:focus { border-color: #729de0; box-shadow: 0 0 0 4px rgba(39, 99, 196, .12); transform: translateY(-1px); }

    button {
      min-width: 92px;
      border: 0;
      border-radius: 13px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), background .2s;
    }

    button:hover { background: #203b63; transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(.98); }

    .summary { display: flex; justify-content: space-between; gap: 12px; margin: 0 4px 12px; color: var(--muted); font-size: .92rem; }
    .summary strong { color: var(--blue); }

    .table-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 24px 62px -45px rgba(20, 36, 61, .48);
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 17px 20px; text-align: left; vertical-align: top; }
    th { background: var(--navy); color: #fff; font-size: .84rem; letter-spacing: .04em; }
    tbody tr { border-top: 1px solid #e7ecf2; transition: transform .25s, background .25s; }
    tbody tr:first-child { border-top: 0; }
    tbody tr:hover { position: relative; z-index: 1; background: #f7faff; transform: translateY(-1px); }
    td:nth-child(1) { width: 23%; color: var(--muted); }
    td:nth-child(2) { width: 27%; color: var(--navy); font-weight: 800; }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { padding: 5px 9px; border-radius: 999px; background: var(--pale); color: #315b98; font-size: .82rem; }

    .row-enter { animation: row-in .42s both; animation-delay: min(calc(var(--row) * 28ms), 420ms); }
    @keyframes row-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .empty, .error { padding: 52px 24px; text-align: center; color: var(--muted); line-height: 1.7; }
    .error { color: #963e3e; background: #fff7f7; }
    code { padding: .14em .42em; border-radius: 5px; background: #edf0f4; color: #28374b; }

    footer { margin-top: 18px; color: var(--muted); font-size: .82rem; line-height: 1.65; }

    [data-reveal] { opacity: 0; transform: translateY(22px); transition: opacity .65s cubic-bezier(.2, .7, .2, 1), transform .65s cubic-bezier(.2, .7, .2, 1); }
    [data-reveal].show { opacity: 1; transform: none; }

    @media (max-width: 700px) {
      main { width: min(100% - 20px, 1120px); padding-top: 32px; }
      .search-panel { grid-template-columns: 1fr; }
      button { height: 46px; }
      th, td { padding: 13px 12px; }
      th:first-child, td:first-child { display: none; }
      td:nth-child(2) { width: 36%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition: none !important; }
      [data-reveal] { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header data-reveal>
      <p class="eyebrow">A Department Directory</p>
      <h1>A부 조직도</h1>
      <p class="lead">과·실국·대표키워드를 검색합니다. 정확한 단어뿐 아니라 <strong>디지탈</strong>처럼 한 글자가 다른 검색어도 찾을 수 있습니다.</p>
    </header>

    <section class="search-panel" aria-label="조직도 검색" data-reveal>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <label for="search" class="sr-only" hidden>과 또는 대표키워드 검색</label>
        <input id="search" type="search" placeholder="예: 디지털, 예산, 안전" autocomplete="off">
      </div>
      <button id="clear" type="button">초기화</button>
    </section>

    <div class="summary" data-reveal>
      <span id="count" aria-live="polite">자료를 읽는 중입니다.</span>
      <span>데이터: <code>org.json</code></span>
    </div>

    <section class="table-shell" data-reveal>
      <table>
        <thead><tr><th scope="col">실국</th><th scope="col">과</th><th scope="col">대표키워드</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="message" hidden></div>
    </section>

    <footer>실행: 이 폴더에서 <code>python -m http.server 8000</code> 실행 후 <code>http://localhost:8000/org.html</code>에 접속합니다. 더블클릭 방식은 브라우저 보안 정책 때문에 JSON을 읽지 못할 수 있습니다.</footer>
  </main>

  <script>
    const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const state = { organizations: [], fuse: null };
    const rows = document.querySelector("#rows");
    const message = document.querySelector("#message");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");

    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    })[character]);

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, (_, row) => [row]);
      for (let column = 0; column <= a.length; column += 1) matrix[0][column] = column;
      for (let row = 1; row <= b.length; row += 1) {
        for (let column = 1; column <= a.length; column += 1) {
          matrix[row][column] = b[row - 1] === a[column - 1]
            ? matrix[row - 1][column - 1]
            : Math.min(matrix[row - 1][column - 1], matrix[row][column - 1], matrix[row - 1][column]) + 1;
        }
      }
      return matrix[b.length][a.length];
    }

    function fallbackSearch(query) {
      const needle = query.trim().toLowerCase();
      if (!needle) return state.organizations;
      return state.organizations.filter((item) => {
        const terms = [item.실국, item.과, ...item.대표키워드].map((term) => term.toLowerCase());
        return terms.some((term) => term.includes(needle) || [...term].some((_, index) => {
          const part = term.slice(index, index + needle.length);
          return part.length === needle.length && levenshtein(part, needle) <= 1;
        }));
      });
    }

    function render(items, query = "") {
      message.hidden = true;
      rows.innerHTML = items.map((item, index) => `
        <tr class="${REDUCE ? "" : "row-enter"}" style="--row:${index}">
          <td>${escapeHtml(item.실국)}</td>
          <td>${escapeHtml(item.과)}</td>
          <td><div class="tags">${item.대표키워드.map((keyword) => `<span class="tag">${escapeHtml(keyword)}</span>`).join("")}</div></td>
        </tr>`).join("");
      count.innerHTML = query
        ? `<strong>${items.length}</strong>개 과 검색됨 · 전체 ${state.organizations.length}개`
        : `전체 <strong>${state.organizations.length}</strong>개 과`;
      if (items.length === 0) {
        message.className = "empty";
        message.textContent = "검색 결과가 없습니다. 다른 과 이름이나 키워드를 입력해 보세요.";
        message.hidden = false;
      }
    }

    function runSearch() {
      const query = search.value.trim();
      if (!query) return render(state.organizations);
      const matches = state.fuse
        ? state.fuse.search(query).map((result) => result.item)
        : fallbackSearch(query);
      render(matches, query);
    }

    async function load() {
      try {
        const response = await fetch("./org.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.organizations = await response.json();
        if (!Array.isArray(state.organizations) || state.organizations.length !== 26) {
          throw new Error("org.json의 원소 수가 26개가 아닙니다.");
        }
        if (window.Fuse) {
          state.fuse = new Fuse(state.organizations, {
            keys: ["과", "실국", "대표키워드"], threshold: .4, distance: 80,
            ignoreLocation: true, minMatchCharLength: 2
          });
        }
        render(state.organizations);
      } catch (error) {
        rows.innerHTML = "";
        count.textContent = "자료를 읽지 못했습니다.";
        message.className = "error";
        message.innerHTML = location.protocol === "file:"
          ? "더블클릭으로 열면 JSON 읽기가 차단됩니다.<br><code>python -m http.server 8000</code> 실행 후 다시 접속하세요."
          : `org.json을 확인하세요. (${escapeHtml(error.message)})`;
        message.hidden = false;
      }
    }

    search.addEventListener("input", runSearch);
    document.querySelector("#clear").addEventListener("click", () => {
      search.value = "";
      render(state.organizations);
      search.focus();
    });

    const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add("show");
      observer.unobserve(entry.target);
    }), { threshold: .12 });
    document.querySelectorAll("[data-reveal]").forEach((element) => observer.observe(element));
    load();
  </script>
</body>
</html>
