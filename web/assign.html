<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 요구자료 배분</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23132a46%22/><path d=%22M18 18h28v28H18z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22/><path d=%22M24 27h16M24 35h16%22 stroke=%22white%22 stroke-width=%224%22/></svg>">
  <style>
    :root{--navy:#132a46;--blue:#2668c8;--sky:#eaf3ff;--green:#23765a;--red:#a33b45;--ink:#172538;--muted:#637083;--line:#d9e1eb;--paper:#fff;--bg:#f3f6fa;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,var(--bg));min-height:100vh}button,input,select{font:inherit}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:13px max(20px,calc((100vw - 1440px)/2));background:rgba(19,42,70,.96);color:#fff;backdrop-filter:blur(12px)}
    .brand{font-weight:900;letter-spacing:-.03em}.nav{display:flex;gap:6px}.nav a,.nav span{padding:8px 12px;border-radius:9px;color:#dce9f8;text-decoration:none;font-size:.88rem}.nav .current{background:#fff;color:var(--navy);font-weight:800;opacity:1;cursor:default}.nav span:not(.current){opacity:.45;cursor:not-allowed}
    main{width:min(1440px,calc(100% - 28px));margin:0 auto;padding:34px 0 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,5vw,3.35rem);letter-spacing:-.055em;color:var(--navy)}.lead{max-width:700px;color:var(--muted);line-height:1.7}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:112px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 13px 30px -25px #18324f}.stat b{display:block;font-size:1.5rem;color:var(--navy)}.stat span{font-size:.78rem;color:var(--muted)}
    .panel{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.95);box-shadow:0 24px 58px -48px #132a46}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:18px}.panel h2{margin:0;color:var(--navy);letter-spacing:-.03em}.panel p{margin:6px 0 0;color:var(--muted);font-size:.9rem;line-height:1.55}
    .inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;margin:0 0 7px;font-size:.82rem;font-weight:800;color:#40516a}.file{display:flex;align-items:center;min-height:48px;padding:9px 12px;border:1px dashed #99afd0;border-radius:12px;background:#f8fbff}.file input{width:100%}.btn{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .2s}.btn:hover{background:#204875;transform:translateY(-2px)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.secondary{background:#e9eff7;color:#27405f}.btn.danger{background:#f7e9eb;color:#8f3440}.btn.small{min-height:34px;padding:0 10px;font-size:.8rem}
    .progress{display:none;align-items:center;gap:12px;margin-top:14px}.progress.on{display:flex}.track{height:8px;flex:1;overflow:hidden;border-radius:99px;background:#e6ebf2}.bar{width:0;height:100%;background:linear-gradient(90deg,#2668c8,#57a4eb);transition:width .28s}.progress-number{width:44px;text-align:right;font-weight:800;color:var(--blue)}
    .notice{display:none;margin-top:14px;padding:12px 14px;border-radius:11px;background:#edf7f3;color:#176248;font-size:.9rem}.notice.on{display:block}.notice.error{background:#fff0f1;color:var(--red);animation:shake .35s}.summary-table{margin-top:15px;width:100%;border-collapse:collapse;font-size:.88rem}.summary-table th,.summary-table td{padding:9px 10px;border-bottom:1px solid #e8edf3;text-align:left}.summary-table th{color:#526176}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .table-wrap{margin-top:15px;overflow:auto;border:1px solid var(--line);border-radius:15px}.cases{width:100%;min-width:1280px;border-collapse:separate;border-spacing:0;font-size:.84rem}.cases th{position:sticky;top:0;z-index:2;padding:12px;background:var(--navy);color:#fff;text-align:left}.cases td{padding:12px;border-top:1px solid #e5eaf1;vertical-align:top;background:#fff}.cases tr:hover td{background:#f8fbff}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;color:#526176;font-weight:800;white-space:nowrap}.status.done{background:#e2f3eb;color:#176248}.question{min-width:100px;font-weight:800}.requirement{min-width:300px;line-height:1.55}.candidate{margin:0 0 5px;padding:6px 8px;border-radius:8px;background:var(--sky);color:#294e82}.candidate b{float:right}.candidate small{display:block;margin-top:3px;color:#62738a}.select{width:170px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}.supports{height:86px}.method{margin-top:7px;color:var(--muted);font-size:.76rem}.empty{padding:50px!important;text-align:center;color:var(--muted)}
    [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.2,.7,.2,1),transform .65s cubic-bezier(.2,.7,.2,1)}[data-reveal].show{opacity:1;transform:none}.row-enter{animation:row-in .38s both;animation-delay:min(calc(var(--row)*22ms),350ms)}
    @keyframes row-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes shake{30%,70%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
    @media(max-width:850px){.hero{display:block}.stats{justify-content:flex-start;margin-top:16px}.inputs{grid-template-columns:1fr}.nav span{display:none}.topbar{padding-inline:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}[data-reveal]{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">A부 국회 요구자료</div><nav class="nav" aria-label="주요 화면"><a href="index.html">시작 화면</a><span class="current" aria-current="page">배분</span><a href="dept.html">현업 회신</a><a href="collect.html">취합</a></nav></header>
  <main>
    <section class="hero" data-reveal><div><p class="eyebrow">S5 · Assignment Desk</p><h1>접수하고, 근거를 보고, 확정합니다</h1><p class="lead">PDF 또는 검증된 문항목록 CSV를 불러오면 문항별 후보 3순위를 계산합니다. 최종 주관·협조 과는 총괄 담당자가 확인합니다.</p></div><div class="stats"><div class="stat"><b id="totalCount">0</b><span>전체 문항</span></div><div class="stat"><b id="receivedCount">0</b><span>접수</span></div><div class="stat"><b id="assignedCount">0</b><span>배분확정</span></div></div></section>

    <section class="panel" data-reveal>
      <div class="panel-head"><div><h2>① 접수</h2><p>원문 PDF는 브라우저 안에서 읽으며 수신·보좌관·연락처는 저장하지 않습니다.</p></div><button class="btn danger small" id="resetAll" type="button">브라우저 기록 초기화</button></div>
      <div class="inputs">
        <div class="field"><label for="pdfFiles">자료요구서 PDF 여러 개</label><div class="file"><input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple></div></div>
        <div class="field"><label for="csvFile">또는 문항목록.csv</label><div class="file"><input id="csvFile" type="file" accept=".csv,text/csv"></div></div>
        <button class="btn" id="register" type="button" disabled>접수 등록</button>
      </div>
      <div class="progress" id="progress"><div class="track"><div class="bar" id="progressBar"></div></div><span class="progress-number" id="progressNumber">0%</span></div>
      <div class="notice" id="notice" role="status"></div>
      <div id="splitSummary"></div>
    </section>

    <section class="panel" data-reveal>
      <div class="toolbar"><div><h2>② 배분</h2><p>1순위를 기본값으로 제시하되 담당자가 수정할 수 있습니다. <span class="status" id="storageMode">저장 방식 확인 중</span></p></div><div class="filters"><select id="statusFilter" class="filter" aria-label="상태 필터"><option value="">전체 상태</option><option value="접수">접수</option><option value="배분확정">배분확정</option><option value="회신중">회신중</option><option value="회신완료">회신완료</option><option value="재배정요청">재배정요청</option></select><input id="textFilter" class="filter" type="search" placeholder="의원·요구내용 검색" aria-label="문항 검색"><button class="btn danger small" id="resetCases" type="button">전체 초기화</button></div></div>
      <div class="table-wrap"><table class="cases"><thead><tr><th>상태</th><th>의원·문항</th><th>요구내용</th><th>후보 3순위</th><th>주관 과</th><th>협조 과</th><th>확정</th></tr></thead><tbody id="caseRows"></tbody></table></div>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="split.js"></script>
  <script src="engine.js"></script>
  <script src="flow.js"></script>
  <script src="api-client.js"></script>
  <script src="history.js"></script>
  <script type="module">
    import * as pdfjsLib from "./lib/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "./lib/pdf.worker.min.mjs";
    const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[character]);
    let staging = [], organizations = [];

    function notice(message, error = false) { const element = $("#notice"); element.textContent = message; element.className = `notice on${error ? " error" : ""}`; }
    function progress(value, visible = true) { const rounded = Math.max(0, Math.min(100, Math.round(value))); $("#progress").classList.toggle("on", visible); $("#progressBar").style.width = `${rounded}%`; $("#progressNumber").textContent = `${rounded}%`; }

    async function extractPdf(file, onPage) {
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      const lines = [];
      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const content = await page.getTextContent();
        let line = "";
        for (const item of content.items) {
          line += `${line ? " " : ""}${item.str}`;
          if (item.hasEOL) { if (line.trim()) lines.push(line.trim()); line = ""; }
        }
        if (line.trim()) lines.push(line.trim());
        onPage(pageNumber, pdf.numPages);
      }
      return RequestSplitter.parseLines(file.name, lines);
    }

    function renderSummary(summaries) {
      $("#splitSummary").innerHTML = `<table class="summary-table"><thead><tr><th>파일명</th><th>파일명 문항 수</th><th>추출</th><th>마지막 번호</th><th>연속</th><th>일치</th></tr></thead><tbody>${summaries.map((item) => `<tr><td>${escapeHtml(item.파일명)}</td><td>${item.파일명의문항수}</td><td>${item.뽑은문항수}</td><td>${item.마지막번호}</td><td>${item.번호연속 ? "O" : "X"}</td><td><b>${item.일치 ? "O" : "X"}</b></td></tr>`).join("")}</tbody></table>`;
    }

    $("#pdfFiles").addEventListener("change", async (event) => {
      const files = [...event.target.files]; if (!files.length) return;
      try {
        staging = []; const summaries = []; progress(0);
        for (let index = 0; index < files.length; index += 1) {
          const result = await extractPdf(files[index], (page, pages) => progress(((index + page / pages) / files.length) * 100));
          if (!result.summary.일치) throw new Error(`${files[index].name}: 문항 수가 일치하지 않습니다.`);
          staging.push(...result.rows); summaries.push(result.summary);
        }
        renderSummary(summaries); $("#register").disabled = staging.length === 0;
        notice(`PDF ${files.length}건에서 ${staging.length}문항을 확인했습니다.`); progress(100);
      } catch (error) { staging = []; $("#register").disabled = true; notice(error.message, true); progress(0, false); }
    });

    $("#csvFile").addEventListener("change", async (event) => {
      try {
        const file = event.target.files[0]; if (!file) return;
        staging = AppCommon.parseCsv(await file.text());
        const required = ["파일명","위원회","의원","제출기한","문항번호","요구내용","세부항목","비고"];
        if (!staging.length || required.some((key) => !(key in staging[0]))) throw new Error("문항목록 CSV의 열이 맞지 않습니다.");
        $("#splitSummary").innerHTML = ""; $("#register").disabled = false; notice(`CSV에서 ${staging.length}문항을 확인했습니다.`);
      } catch (error) { staging = []; $("#register").disabled = true; notice(error.message, true); }
    });

    $("#register").addEventListener("click", async () => {
      try {
        const prepared = staging.map((item) => ({ ...item, candidates: DistributionEngine.classify(item.요구내용 ?? item.requirement ?? "") }));
        const response = await ApiClient.post("접수", { cases: prepared }, organizations);
        notice(`접수 등록 완료: 새 문항 ${response.result.added}건, 전체 ${response.result.total}건`); staging = []; $("#register").disabled = true; await renderCases();
      } catch (error) { notice(error.message, true); }
    });

    function departmentOptions(selected = "") { return organizations.map((item) => `<option value="${escapeHtml(item.과)}"${item.과 === selected ? " selected" : ""}>${escapeHtml(item.과)}</option>`).join(""); }
    async function renderCases() {
      const status = $("#statusFilter").value, query = $("#textFilter").value.trim().toLowerCase();
      const all = await ApiClient.getCases();
      const filtered = all.filter((item) => (!status || item.status === status) && (!query || `${item.member} ${item.requirement}`.toLowerCase().includes(query)));
      $("#totalCount").textContent = all.length; $("#receivedCount").textContent = all.filter((item) => item.status === "접수").length; $("#assignedCount").textContent = all.filter((item) => item.status === "배분확정").length;
      $("#caseRows").innerHTML = filtered.length ? filtered.map((item, index) => {
        const first = item.candidates[0]?.과 ?? ""; const selected = item.leadDepartment || first;
        const candidates = item.candidates.length ? item.candidates.map((candidate, rank) => `<div class="candidate">${rank + 1}. ${escapeHtml(candidate.과)} <b>${candidate.점수}</b><small>${escapeHtml(candidate.근거키워드.join(", ") || "근거 키워드 없음")}</small></div>`).join("") : '<span class="status">확인필요</span>';
        const past = PastHistory.find(item); const pastText = past.count ? `<div class="method">과거 ${past.count}건 · 주로 <b>${escapeHtml(past.mainDepartment)}</b></div>` : '<div class="method">과거 이력 없음</div>';
        const reassignment = item.reassignment ? `<div class="notice on error"><b>재배정:</b> ${escapeHtml(item.reassignment.reason)} → ${escapeHtml(item.reassignment.desiredDepartment)}</div>` : "";
        const canAssign = ["접수", "재배정요청"].includes(item.status);
        return `<tr class="${REDUCE ? "" : "row-enter"}" style="--row:${index}" data-id="${escapeHtml(item.id)}" data-first="${escapeHtml(first)}"><td><span class="status ${item.status === "회신완료" ? "done" : ""}">${escapeHtml(item.status)}</span></td><td class="question">${escapeHtml(item.member)}<br>${escapeHtml(item.questionNumber)}번</td><td class="requirement">${escapeHtml(item.requirement)}${reassignment}</td><td>${candidates}${pastText}</td><td><select class="select lead" ${canAssign ? "" : "disabled"}><option value="">선택</option>${departmentOptions(selected)}</select><div class="method">확정방법: <b>${selected && selected === first ? "규칙" : "수정"}</b></div></td><td><select class="select supports" multiple aria-label="협조 과" ${canAssign ? "" : "disabled"}>${departmentOptions("")}</select></td><td><button class="btn small confirm" type="button"${canAssign ? "" : " disabled"}>${item.status === "재배정요청" ? "다시 배분" : canAssign ? "배분 확정" : "확정됨"}</button></td></tr>`;
      }).join("") : '<tr><td colspan="7" class="empty">표시할 문항이 없습니다. 먼저 PDF 또는 CSV를 접수하세요.</td></tr>';
      for (const row of document.querySelectorAll("#caseRows tr[data-id]")) {
        const item = all.find((entry) => entry.id === row.dataset.id);
        [...row.querySelector(".supports").options].forEach((option) => option.selected = item.supportDepartments.includes(option.value));
        row.querySelector(".lead").addEventListener("change", (event) => { row.querySelector(".method b").textContent = event.target.value && event.target.value === row.dataset.first ? "규칙" : "수정"; });
      }
    }

    $("#statusFilter").addEventListener("change", renderCases); $("#textFilter").addEventListener("input", renderCases);
    $("#caseRows").addEventListener("click", async (event) => {
      const button = event.target.closest("button.confirm");
      if (!button) return;
      event.preventDefault();
      event.stopPropagation();
      const row = button.closest("tr[data-id]");
      try {
        const item = (await ApiClient.getCases()).find((entry) => entry.id === row.dataset.id);
        if (!item) throw new Error("문항을 찾을 수 없습니다.");
        const lead = row.querySelector(".lead").value;
        const supports = [...row.querySelector(".supports").selectedOptions].map((option) => option.value);
        const method = lead && lead === row.dataset.first ? "규칙" : "수정";
        await ApiClient.post("배분", { id: row.dataset.id, leadDepartment: lead, supportDepartments: supports, confirmationMethod: method }, organizations);
        notice(`${item.member} ${item.questionNumber}번을 ${lead}로 배분 확정했습니다.`);
        await renderCases();
      } catch (error) { notice(error.message, true); }
    });

    function resetEverything() {
      if (!confirm("접수·배분 기록과 현재 선택 파일을 모두 초기화할까요?")) return;
      ApiClient.clear();
      staging = [];
      $("#pdfFiles").value = "";
      $("#csvFile").value = "";
      $("#statusFilter").value = "";
      $("#textFilter").value = "";
      $("#splitSummary").innerHTML = "";
      $("#register").disabled = true;
      progress(0, false);
      notice("접수·배분 기록과 선택 파일을 모두 초기화했습니다.");
      renderCases();
    }
    $("#resetAll").addEventListener("click", resetEverything);
    $("#resetCases").addEventListener("click", resetEverything);
    document.addEventListener("submit", (event) => event.preventDefault());

    const observer = new IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add("show"); observer.unobserve(entry.target); } }), { threshold: .12 });
    document.querySelectorAll("[data-reveal]").forEach((element) => observer.observe(element));

    try {
      const [organizationResponse] = await Promise.all([
        fetch("./data/A부_조직도_26개과.csv"),
        DistributionEngine.initialize({ rulesUrl: "./data/rules_보강.csv", organizationUrl: "./data/A부_조직도_26개과.csv" }),
        PastHistory.initialize(),
      ]);
      if (!organizationResponse.ok) throw new Error("조직도를 읽지 못했습니다.");
      organizations = AppCommon.parseCsv(await organizationResponse.text());
      if (organizations.length !== 26) throw new Error(`조직도는 26개 과여야 합니다. 현재 ${organizations.length}개입니다.`);
      const requestedStatus = new URLSearchParams(location.search).get("status");
      if (requestedStatus === "received") $("#statusFilter").value = "접수";
      if (requestedStatus === "assigned") $("#statusFilter").value = "배분확정";
      $("#storageMode").textContent = ApiClient.mode;
      await renderCases();
    } catch (error) { notice(`초기화 실패: ${error.message}. 로컬 서버로 열었는지 확인하세요.`, true); }
  </script>
</body>
</html>
