<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국회 요구자료 현황</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23132a46%22/><path d=%22M18 18h28v28H18z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22/></svg>">
  <style>
    :root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#172538;--navy:#132a46;--blue:#2668c8;--line:#d9e1eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 5%,#dceaff,transparent 35rem),#f4f7fa}.top{padding:15px max(20px,calc((100vw - 1100px)/2));background:var(--navy);color:#fff;font-weight:900}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:70px 0}.eyebrow{color:var(--blue);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:.78rem}h1{max-width:760px;margin:10px 0;font-size:clamp(2.2rem,6vw,4.7rem);letter-spacing:-.065em;color:var(--navy);line-height:1.05}.lead{max-width:650px;color:#607087;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}.card{padding:22px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 22px 50px -42px #132a46;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}.card:hover{transform:translateY(-6px)}.card b{display:block;margin-bottom:15px;font-size:1.15rem;color:var(--navy)}.card .number{font-size:2.5rem;font-weight:900;color:var(--blue)}.card a{display:inline-block;margin-top:18px;padding:9px 12px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800}.disabled{opacity:.52}.disabled span{font-size:.78rem;color:#65758b}.note{margin-top:22px;padding:16px 18px;border-left:4px solid var(--blue);background:#fff;border-radius:8px;color:#526176;line-height:1.6}[data-reveal]{opacity:0;transform:translateY(28px);animation:show .65s forwards;animation-delay:var(--delay,0ms)}@keyframes show{to{opacity:1;transform:none}}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}[data-reveal]{opacity:1;transform:none}}
  </style>
</head>
<body><header class="top">A부 국회 요구자료</header><main><p class="eyebrow" data-reveal>S6 · v0.6</p><h1 data-reveal style="--delay:70ms">배분과 회신 기록을 같은 단계로 봅니다</h1><p class="lead" data-reveal style="--delay:130ms">로컬에서는 한 브라우저 저장소를 공유하고, Vercel에서는 /api/app과 cases.json을 통해 여러 담당자가 같은 기록을 봅니다.</p><section class="cards" data-reveal style="--delay:190ms"><article class="card"><b>전체 문항</b><div class="number" id="total">0</div><a href="assign.html">배분 화면</a></article><article class="card"><b>접수</b><div class="number" id="received">0</div><a href="assign.html?status=received">확인하기</a></article><article class="card"><b>배분확정</b><div class="number" id="assigned">0</div><a href="assign.html?status=assigned">확인하기</a></article><article class="card"><b>현업 회신·취합</b><div class="number" id="replied">0</div><a href="dept.html">현업 회신</a> <a href="collect.html">취합 현황</a></article></section><div class="note" data-reveal style="--delay:250ms">답변과 결재 출력은 재외동포청 공식 HWP 양식 2종만 사용합니다. 질의서 입력 형식은 서로 달라도 됩니다.</div></main><script src="common.js"></script><script src="flow.js"></script><script src="api-client.js"></script><script>(async()=>{const cases=await ApiClient.getCases();document.querySelector('#total').textContent=cases.length;document.querySelector('#received').textContent=cases.filter(x=>x.status==='접수').length;document.querySelector('#assigned').textContent=cases.filter(x=>x.status==='배분확정').length;document.querySelector('#replied').textContent=cases.filter(x=>['회신중','회신완료'].includes(x.status)).length})().catch(console.error);</script></body>
</html>
