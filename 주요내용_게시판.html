<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회업무자료 게시판</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #20242c;
      --muted: #6e7481;
      --line: #d9dde6;
      --primary: #2457c5;
      --primary-dark: #1d469d;
      --green: #087f5b;
      --red: #c92a2a;
      --yellow: #fff3bf;
      --shadow: 0 14px 32px rgba(28, 35, 49, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 3vw, 38px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(82px, 1fr));
      gap: 8px;
      min-width: 280px;
    }

    .stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: var(--primary);
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .form-panel {
      position: sticky;
      top: 18px;
      padding: 18px;
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      color: #343a46;
      font-weight: 700;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea {
      min-height: 138px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 87, 197, 0.14);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .check-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 9px 13px;
      background: #edf1f8;
      color: var(--ink);
      font-weight: 700;
    }

    .btn.primary {
      flex: 1;
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--primary-dark);
    }

    .btn.ghost {
      border-color: var(--line);
      background: #fff;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 160px 140px;
      gap: 10px;
      margin-bottom: 12px;
    }

    .board {
      min-height: 420px;
    }

    .post-list {
      display: grid;
      gap: 10px;
    }

    .post {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .post.pinned {
      border-color: #e0b100;
      background: linear-gradient(0deg, #fff, #fff 58%, var(--yellow));
    }

    .post-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .post h2 {
      margin: 0;
      font-size: 19px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      background: #edf1f8;
      color: #364259;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.notice {
      background: #d3f9d8;
      color: var(--green);
    }

    .badge.pin {
      background: #ffe066;
      color: #7a5a00;
    }

    .content {
      margin: 12px 0 0;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .post-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .icon-btn {
      min-width: 38px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }

    .icon-btn.danger {
      color: var(--red);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px dashed #bfc5d1;
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      background: rgba(255, 255, 255, 0.68);
    }

    @media (max-width: 860px) {
      .topbar {
        display: block;
      }

      .stats {
        margin-top: 16px;
        min-width: 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .form-panel {
        position: static;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .row,
      .stats {
        grid-template-columns: 1fr;
      }

      .post-head {
        display: block;
      }

      .post-actions {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>국회업무자료 게시판</h1>
        <p class="subtitle">국회 관련 요청자료, 회신 현황, 참고 사항을 한 곳에 게시하고 관리합니다.</p>
      </div>
      <section class="stats" aria-label="국회업무자료 게시 현황">
        <div class="stat">
          <strong id="totalCount">0</strong>
          <span>전체</span>
        </div>
        <div class="stat">
          <strong id="pinCount">0</strong>
          <span>고정</span>
        </div>
        <div class="stat">
          <strong id="todayCount">0</strong>
          <span>오늘 작성</span>
        </div>
      </section>
    </header>

    <section class="layout">
      <form class="panel form-panel" id="postForm">
        <h2 class="panel-title" id="formTitle">국회업무자료 게시</h2>
        <input type="hidden" id="editingId">

        <div class="field">
          <label for="title">제목</label>
          <input id="title" type="text" placeholder="예: 제출 마감 안내" required maxlength="80">
        </div>

        <div class="row">
          <div class="field">
            <label for="category">자료 구분</label>
            <select id="category">
              <option>공지</option>
              <option>요청</option>
              <option>회신</option>
              <option>참고</option>
            </select>
          </div>
          <div class="field">
            <label for="writer">작성자</label>
            <input id="writer" type="text" placeholder="작성자명" maxlength="30">
          </div>
        </div>

        <div class="field">
          <label for="content">국회업무자료 내용</label>
          <textarea id="content" placeholder="요청 취지, 회신 요지, 제출 일정 등 게시할 내용을 입력하세요." required></textarea>
        </div>

        <label class="check-row">
          <input id="pinned" type="checkbox">
          상단에 고정
        </label>

        <div class="actions">
          <button class="btn primary" type="submit" id="submitBtn">자료 게시</button>
          <button class="btn ghost" type="button" id="resetBtn">초기화</button>
        </div>
      </form>

      <section class="board">
        <div class="toolbar" aria-label="국회업무자료 검색 및 필터">
          <input id="search" type="search" placeholder="자료명, 내용, 작성자 검색">
          <select id="filter">
            <option value="all">전체 구분</option>
            <option value="공지">공지</option>
            <option value="요청">요청</option>
            <option value="회신">회신</option>
            <option value="참고">참고</option>
          </select>
          <select id="sort">
            <option value="latest">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="title">제목순</option>
          </select>
        </div>

        <div class="post-list" id="postList"></div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "mainBoardPosts.v1";
    const form = document.getElementById("postForm");
    const formTitle = document.getElementById("formTitle");
    const editingId = document.getElementById("editingId");
    const title = document.getElementById("title");
    const category = document.getElementById("category");
    const writer = document.getElementById("writer");
    const content = document.getElementById("content");
    const pinned = document.getElementById("pinned");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const search = document.getElementById("search");
    const filter = document.getElementById("filter");
    const sort = document.getElementById("sort");
    const postList = document.getElementById("postList");
    const totalCount = document.getElementById("totalCount");
    const pinCount = document.getElementById("pinCount");
    const todayCount = document.getElementById("todayCount");

    const starterPosts = [
      {
        id: crypto.randomUUID(),
        title: "국회업무자료 게시 안내",
        category: "공지",
        writer: "담당자",
        content: "국회 요구자료, 부서별 회신 현황, 제출 마감일, 참고 사항을 이 게시판에 게시해 주세요.",
        pinned: true,
        createdAt: new Date().toISOString()
      }
    ];

    let posts = loadPosts();

    function loadPosts() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return starterPosts;

      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : starterPosts;
      } catch {
        return starterPosts;
      }
    }

    function savePosts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function isToday(value) {
      const today = new Date();
      const date = new Date(value);
      return today.toDateString() === date.toDateString();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function render() {
      const keyword = search.value.trim().toLowerCase();
      const categoryFilter = filter.value;

      let visiblePosts = posts.filter((post) => {
        const matchesCategory = categoryFilter === "all" || post.category === categoryFilter;
        const target = `${post.title} ${post.content} ${post.writer}`.toLowerCase();
        return matchesCategory && target.includes(keyword);
      });

      visiblePosts.sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        if (sort.value === "oldest") return new Date(a.createdAt) - new Date(b.createdAt);
        if (sort.value === "title") return a.title.localeCompare(b.title, "ko-KR");
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      totalCount.textContent = posts.length;
      pinCount.textContent = posts.filter((post) => post.pinned).length;
      todayCount.textContent = posts.filter((post) => isToday(post.createdAt)).length;

      if (visiblePosts.length === 0) {
        postList.innerHTML = '<div class="empty">표시할 국회업무자료가 없습니다.</div>';
        return;
      }

      postList.innerHTML = visiblePosts.map((post) => `
        <article class="post ${post.pinned ? "pinned" : ""}">
          <div class="post-head">
            <div>
              <h2>${escapeHtml(post.title)}</h2>
              <div class="meta">
                ${post.pinned ? '<span class="badge pin">고정</span>' : ""}
                <span class="badge ${post.category === "공지" ? "notice" : ""}">${escapeHtml(post.category)}</span>
                <span>${escapeHtml(post.writer || "작성자 없음")}</span>
                <span>${formatDate(post.createdAt)}</span>
              </div>
            </div>
            <div class="post-actions" aria-label="국회업무자료 작업">
              <button class="icon-btn" type="button" title="자료 수정" onclick="editPost('${post.id}')">수정</button>
              <button class="icon-btn danger" type="button" title="자료 삭제" onclick="deletePost('${post.id}')">삭제</button>
            </div>
          </div>
          <p class="content">${escapeHtml(post.content)}</p>
        </article>
      `).join("");
    }

    function resetForm() {
      form.reset();
      editingId.value = "";
      formTitle.textContent = "국회업무자료 게시";
      submitBtn.textContent = "자료 게시";
      title.focus();
    }

    function editPost(id) {
      const post = posts.find((item) => item.id === id);
      if (!post) return;

      editingId.value = post.id;
      title.value = post.title;
      category.value = post.category;
      writer.value = post.writer;
      content.value = post.content;
      pinned.checked = post.pinned;
      formTitle.textContent = "국회업무자료 수정";
      submitBtn.textContent = "수정 저장";
      title.focus();
    }

    function deletePost(id) {
      if (!confirm("이 국회업무자료를 삭제할까요?")) return;
      posts = posts.filter((post) => post.id !== id);
      savePosts();
      render();
      if (editingId.value === id) resetForm();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const postData = {
        title: title.value.trim(),
        category: category.value,
        writer: writer.value.trim(),
        content: content.value.trim(),
        pinned: pinned.checked
      };

      if (!postData.title || !postData.content) return;

      if (editingId.value) {
        posts = posts.map((post) => post.id === editingId.value
          ? { ...post, ...postData }
          : post
        );
      } else {
        posts.unshift({
          id: crypto.randomUUID(),
          ...postData,
          createdAt: new Date().toISOString()
        });
      }

      savePosts();
      resetForm();
      render();
    });

    resetBtn.addEventListener("click", resetForm);
    search.addEventListener("input", render);
    filter.addEventListener("change", render);
    sort.addEventListener("change", render);

    render();
  </script>
</body>
</html>
